name: Build KeyMouse

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: KEYMOUSE_UNIVERSAL=1 bash scripts/build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'build/KeyMouse.app' build/KeyMouse.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyMouse-macOS
          path: build/KeyMouse.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyMouse-macOS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" KeyMouse.zip --title "KeyMouse $RELEASE_TAG" --generate-notes
